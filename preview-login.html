<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login icon try-outs</title>
<link rel="stylesheet" href="style.css" />
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#02040a;color:#eaf6ff;font-family:Rajdhani,sans-serif}
  .wrap{width:min(92vw,560px);text-align:center}
  .row{display:flex;gap:18px;justify-content:center;margin:22px 0;flex-wrap:wrap}
  .opt{display:flex;flex-direction:column;gap:8px;align-items:center}
  .opt .icon-btn{width:56px;height:56px;font-size:1.6rem}
  .opt small{letter-spacing:.14em;font-size:.72rem;color:#9fb3c8}
  .opt code{color:#7df7ff;font-size:.8rem}
  a{color:#7df7ff}
</style>
</head>
<body>
<div class="wrap">
  <h2>HOME LOGIN GLYPH — TRY-OUTS</h2>
  <p>Same <code>.icon-btn</code> style as the home header. Pick the one that reads “login / pilot” best.</p>
  <div class="row">
    <div class="opt"><button class="icon-btn" type="button">⛑</button><small>A — PILOT HELMET</small><code>⛑ U+26D1</code></div>
    <div class=\"opt\"><button class=\"icon-btn\" type=\"button\">➔</button><small>B — LOGIN DOOR ARROW</small><code>➔ U+2794</code></div>
    <div class=\"opt\"><button class=\"icon-btn\" type=\"button\">👤</button><small>C — USER SILHOUETTE</small><code>👤 U+1F464</code></div>
    <div class=\"opt\"><button class=\"icon-btn\" type=\"button\">➤</button><small>D — SHIP NOSE</small><code>➤ U+27A4</code></div>
  </div>
  <p><a href=\"/\">← back to game</a> · reply with A / B / C / D and I’ll set it on #btnPilot.</p>
</div>
</body>
</html>
